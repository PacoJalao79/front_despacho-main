name: CI/CD Frontend - Despachos

on:
  push:
    branches:
      - deploy   # Solo se activa al empujar a esta rama

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Login a Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build y Push imagen
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/front-despachos:latest
        build-args: |
          VITE_DESPACHOS_API_URL=${{ secrets.VITE_DESPACHOS_API_URL }}
          VITE_VENTAS_API_URL=${{ secrets.VITE_VENTAS_API_URL }}

    - name: Deploy en EC2 Frontend
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_FRONTEND_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/app/frontend
          docker-compose pull
          docker-compose up -d --force-recreate
          docker image prune -f